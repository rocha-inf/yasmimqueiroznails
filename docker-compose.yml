services:
  postgresql:
    image: postgres:alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    container_name: "yasmimqueiroznails"
    restart: always
    volumes:
      - ./data-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

volumes:
  data-postgresql: